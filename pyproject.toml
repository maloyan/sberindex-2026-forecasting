[project]
name = "sberindex-2026-forecasting"
version = "1.0.0"
description = "СберИндекс 2026, трек «Прогнозирование»: прогноз безналичных расходов по МО и поиск структурных сдвигов"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
# Exact versions of the run that produced the report: requirements.lock.txt
dependencies = [
  "numpy>=2.1", "pandas>=2.2,<3", "pyarrow>=18", "pyyaml>=6", "openpyxl>=3.1", "xlrd>=2.0",
  "scipy>=1.13", "scikit-learn>=1.5", "joblib>=1.4", "matplotlib>=3.9", "geopandas>=1.0",
  "lightgbm>=4.5", "catboost>=1.2", "prophet>=1.1", "statsforecast>=2.0", "ruptures>=1.1",
  "holidays>=0.60", "unrar-cffi>=0.2",
  "torch>=2.8", "chronos-forecasting>=2.2", "timesfm[torch]>=2.0", "tirex-2>=0.3", "toto-models>=1.0",
]

[tool.ruff]
line-length = 110
